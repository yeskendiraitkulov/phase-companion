plugins {
	id 'java-library'
}

group = project.maven_group
version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	// Gson ships with the game on every supported version, so it stays out of the mod jar.
	compileOnly "com.google.code.gson:gson:${project.gson_version}"
	testImplementation "com.google.code.gson:gson:${project.gson_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	// 17 is the oldest Java among the target game versions (1.20.1).
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

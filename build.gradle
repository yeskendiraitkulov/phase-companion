plugins {
	// Both Loom variants from one artifact are declared here so the adapters load them
	// with a single class loader. 26.x ships unobfuscated, so it uses Loom without remapping;
	// 1.21.1 and older use the regular Loom with Mojang mappings.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

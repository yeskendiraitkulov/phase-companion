# Phase Companion для NeoForge. Справка: https://docs.neoforged.net/docs/1.21.1/gettingstarted/modfiles/
#
# Только сервер (встроенный сервер хоста). В NeoForge 1.20.5+ поля displayTest больше нет:
# совместимость клиента и сервера решают сетевые пакеты модов. Мод не регистрирует ни одного
# пакета, блока, предмета и записи реестра — гостю без мода (и ванильному клиенту) нечего
# согласовывать.
modLoader="javafml"
loaderVersion="[1,)"
license="MPL-2.0"
issueTrackerURL="https://github.com/yeskendiraitkulov/phase-companion/issues"

[[mods]]
modId="phase_companion"
version="${version}"
displayName="Phase Companion"
displayURL="https://phaseclient.com"
authors="Phase"
description='''Companion to the Phase LAN app: real Tab header, instant name colors and prefixes, up to 20 players in an Open to LAN world. Host only, guests need nothing.'''

[[mixins]]
config="phase_companion.mixins.json"

[[dependencies.phase_companion]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge}"
    ordering="NONE"
    side="BOTH"

[[dependencies.phase_companion]]
    modId="minecraft"
    type="required"
    versionRange="${mc}"
    ordering="NONE"
    side="BOTH"

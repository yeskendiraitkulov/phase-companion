# Phase Companion for NeoForge. Reference: https://docs.neoforged.net/docs/1.21.1/gettingstarted/modfiles/
#
# Server only (the host's integrated server). NeoForge 1.20.5+ has no displayTest field:
# client/server compatibility is decided by mod network packets. The mod registers no
# packet, block, item or registry entry, so a guest without the mod (or a vanilla client) has nothing
# to negotiate.
modLoader="javafml"
loaderVersion="[1,)"
license="MPL-2.0"
issueTrackerURL="https://github.com/yeskendiraitkulov/phase-companion/issues"

[[mods]]
modId="phase_companion"
version="${version}"
displayName="Phase Companion"
displayURL="https://github.com/yeskendiraitkulov/phase-companion"
authors="Phase"
description='''Companion to the Phase LAN app: real Tab header, instant name colors and prefixes, up to 20 players in an Open to LAN world. Host only, guests need nothing.'''

[[mixins]]
config="phase_companion.mixins.json"

[[dependencies.phase_companion]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge}"
    ordering="NONE"
    side="BOTH"

[[dependencies.phase_companion]]
    modId="minecraft"
    type="required"
    versionRange="${mc}"
    ordering="NONE"
    side="BOTH"

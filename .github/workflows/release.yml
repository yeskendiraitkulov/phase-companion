name: release

# Тег v* (например v0.1.0) собирает мод и выкладывает релиз: jar и companion.json.
# Phase берёт companion.json из «latest release» и ставит мод у хоста одной кнопкой.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Collect jars
        # Каждый адаптер <загрузчик>/<версия игры> (fabric, forge, neoforge) сам называет jar
        # как в релизе: phase-companion-<загрузчик>-<версия игры>-<версия мода>.jar.
        # Gradle идёт на Java 25: на ней же ForgeGradle запускает свои инструменты; jar для
        # 1.21.1 собираются под Java 21 (options.release), недостающую Java Gradle скачает сам.
        run: |
          mkdir dist
          for loader in fabric forge neoforge; do
            cp $loader/*/build/libs/phase-companion-$loader-*.jar dist/
          done
          ls -l dist
          # Сколько адаптеров, столько и jar: ни один загрузчик не выпал из релиза молча.
          test "$(ls dist/*.jar | wc -l)" -eq "$(ls -d {fabric,forge,neoforge}/*/build.gradle | wc -l)"
      - name: Manifest
        run: python tools/make_manifest.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Phase Companion $GITHUB_REF_NAME" --generate-notes

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
mod_version=0.3.0
maven_group=app.phase.companion

# Fabric: check versions at https://fabricmc.net/develop
# Game version and Java are in fabric/<version>/gradle.properties.
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Shared dependencies
gson_version=2.13.2
junit_version=5.13.4
# The Forge/NeoForge mixin test reads the bytecode of game classes.
asm_version=9.8

# Forge: ForgeGradle 7 (plugin on the Gradle Plugin Portal). The Forge version is in forge/<version>/gradle.properties.
forgegradle_version=7.0.40
# NeoForge: ModDevGradle. The NeoForge version is in neoforge/<version>/gradle.properties.
moddev_version=2.0.148
